[tox]
env_list = check, test

[testenv]
package = editable
base_python = 3.12
deps =
    ruff~=0.14.4
    pytest~=8.3.5

[testenv:check]
skip_install = true
deps =
    {[testenv]deps}
    pre-commit~=4.3
commands =
    ruff check
    ruff format --diff
    pre-commit run nbstripout --all-files --show-diff-on-failure

[testenv:format]
skip_install = true
commands =
    ruff check --fix
    ruff format

[testenv:test]
commands =
    pytest
