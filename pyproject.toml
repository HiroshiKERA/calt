[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calt-x"
version = "1.6.0"
description = "A library for computational algebra using Transformers"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Hiroshi Kera", email = "kera.hiroshi@gmail.com"},
  {name = "Yuta Sato", email = "sato.yuta@gmail.com"},
  {name = "Shun Arakawa", email = "shun.arkw@gmail.com"}
]

dependencies = [
    "transformers>=4.49.0",
    "omegaconf>=2.3.0",
    "torch>=2.6.0",
    "wandb>=0.15.11",
    "accelerate>=0.29.0",
    "joblib>=1.5.0",
    "sympy>=1.12",
    "IPython>=8.18.1",
]

[project.optional-dependencies]
kaggle = [
    "kaggle",
]

[project.scripts]
calt = "calt.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff~=0.14.4",
    "pydantic>=2.10.6",
    "pytest~=8.3.5",
    "mike~=2.1.3",
    "mkdocs~=1.6.1",
    "mkdocs-macros-plugin~=1.3.7",
    "mkdocs-material~=9.6.12",
    "mkdocstrings-python~=1.16.10",
    "mkdocs-llmstxt~=0.2.0",
    "strands-agents~=0.1.0",
    "mkdocstrings[python]>=0.29.1",
    "build>=1.3.0",
    "tox>=4.0.0",
    "pre-commit>=3.0.0",
]

[tool.uv]
# Applies to `uv lock`/`uv sync` and to `uv pip install` run inside this
# project; it never reaches the published package metadata.
# torch 2.15 and numpy 2.5.2 are the first releases with cp315 wheels, but
# torch 2.15's PyPI wheels need CUDA 13 (NVIDIA driver >= 580). Keep the
# CUDA 12 build of torch on Python < 3.15 so that GPUs with older drivers
# still work in dev. This freezes dev torch at 2.9.x on every
# `uv lock --upgrade`: drop the `torch<2.10` line once the dev GPUs run
# driver >= 580, then run `uv lock --upgrade-package torch`. The two
# `>= '3.15'` lines only force a separate 3.15 resolution, and can go once
# a single torch and numpy version covers every supported Python.
constraint-dependencies = [
    "torch<2.10; python_version < '3.15'",
    "torch>=2.15; python_version >= '3.15'",
    "numpy>=2.5.2; python_version >= '3.15'",
]

[tool.ruff]
lint.extend-select = ["I"]
lint.per-file-ignores = {"src/calt/__init__.py" = ["F401"], "src/calt/data_loader/__init__.py" = ["F401"],"src/calt/generate/__init__.py" = ["F401"],"src/calt/generate_by_sage/__init__.py" = ["F401"],"src/calt/trainer/__init__.py" = ["F401"],"src/calt/data_loader/utils/__init__.py" = ["F401"],"src/calt/generator/__init__.py" = ["F401"],"src/calt/generator/sagemath/__init__.py" = ["F401"],"src/calt/generator/sympy/__init__.py" = ["F401"]}
exclude = [
  "docs/*",
  "examples/*",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"] 

[project.urls]
Source        = "https://github.com/HiroshiKERA/calt"
Issues        = "https://github.com/HiroshiKERA/calt/issues"
