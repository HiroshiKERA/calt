name: PR Validation

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }} --frozen --dev

      - name: Run pytest
        run: uv run --python ${{ matrix.python-version }} pytest

  test-transformers-v5:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv sync --python 3.12 --frozen --dev

      - name: Install transformers v5
        run: uv pip install "transformers>=5.0.0" --python .venv/bin/python

      - name: Run pytest
        run: uv run --python 3.12 --no-sync pytest

