name: PyPI Release

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      # Needed to create the GitHub Release after publishing.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          prune-cache: true

      - name: Install build tooling
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install --upgrade build

      - name: Clean dist directory
        run: rm -rf dist

      - name: Build package
        run: uv run python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Tag and release the same commit that was published, so GitHub
      # Releases stay in step with PyPI. Edit the generated notes afterwards
      # if a hand-written summary is wanted.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          gh release create "v${version}" \
            --target "${GITHUB_SHA}" \
            --title "CALT v${version}" \
            --generate-notes \
            --latest
