# ReLU recurrence (L=10), decoder-only model.
#
# Same data, tokenizer, optimizer and budget as configs/train.yaml; the only
# change is the model. The encoder-decoder result put forward and reverse in a
# tie at 100.0%, so the ordering effect the table reports could no longer be
# read off it. A decoder-only stack is both the standard choice in the
# arithmetic literature and the smaller model, which is what the tie calls for.
#
# A deliberately small stack: 2 layers, d_model 128. If the ordering effect is
# only hidden by capacity, this is where it reappears in the final numbers.

model:
  model_type: decoder_only
  num_layers: 2
  num_heads: 4
  d_model: 128
  ffn_dim: 512
  max_sequence_length: 256

train:
  save_dir: ./results_decoder_small
  num_train_epochs: 64
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  batch_size: 128
  test_batch_size: 128
  lr_scheduler_type: linear
  max_grad_norm: 1.0
  optimizer: adamw_torch
  num_workers: 4
  seed: 42
  wandb:
    project: calt-issac26
    group: relu_recurrence_decoder_small
    name: relu_recurrence_L10_decoder_small
    no_wandb: False

data:
  train_dataset_path: ./data/train_raw.txt
  test_dataset_path: ./data/test_raw.txt
  lexer_config: ./configs/lexer.yaml
  validate_train_tokens: true
  validate_test_tokens: true
