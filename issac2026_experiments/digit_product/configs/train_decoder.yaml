# A-Multiplication-DL (Prod, L=10), decoder-only model.
#
# The other half of Table 4. Same data, tokenizer, optimizer and 64-epoch budget
# as configs/train.yaml; only the model differs, and it differs the same way as
# in relu_recurrence/configs/train_decoder.yaml, so the two rows of the table
# stay comparable to each other.

model:
  model_type: decoder_only
  num_layers: 6
  num_heads: 8
  d_model: 512
  ffn_dim: 2048
  max_sequence_length: 256

train:
  save_dir: ./results_decoder
  num_train_epochs: 64
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  batch_size: 128
  test_batch_size: 128
  lr_scheduler_type: linear
  max_grad_norm: 1.0
  optimizer: adamw_torch
  num_workers: 4
  seed: 42
  wandb:
    project: calt-issac26
    group: digit_product_decoder
    name: digit_product_L10_decoder
    no_wandb: False

data:
  train_dataset_path: ./data/train_raw.txt
  test_dataset_path: ./data/test_raw.txt
  lexer_config: ./configs/lexer.yaml
  validate_train_tokens: true
  validate_test_tokens: true
